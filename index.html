<script>const QUESTIONS=[{"id": 1, "cat": "易", "num": 1, "q": "火箭彈短路夾的使用意義", "a": "形成短路，防止靜電或意外引發火箭彈"}, {"id": 2, "cat": "易", "num": 2, "q": "手榴彈空殼繳回品項有哪些", "a": "1.保險插銷 2.煙幕彈罐體及壓板 3.空塑膠筒 4.木箱"}, {"id": 3, "cat": "易", "num": 3, "q": "彈藥分庫平、戰時採何種方式運補到營級（含比照）以上單位", "a": "1.平時採計畫運補 2.戰時採主動運補"}, {"id": 4, "cat": "易", "num": 4, "q": "彈藥補給基準，通常以何單位表示", "a": "以核定之補給日份表示之"}, {"id": 5, "cat": "易", "num": 5, "q": "工令號碼114-KI-保養-002代表什麼意思", "a": "114年度金門支援營彈藥連保養第002號工令"}, {"id": 6, "cat": "易", "num": 6, "q": "固定式彈藥之外形是否合乎標準，通常以何種方法檢查來決定", "a": "合膛試驗"}, {"id": 7, "cat": "易", "num": 7, "q": "彈藥變質率統計，數列有哪幾種", "a": "1.時間數列 2.空間數列 3.屬性數列 4.變量數列"}, {"id": 8, "cat": "易", "num": 8, "q": "發射藥燃燒方式有哪幾種", "a": "1.減面燃燒 2.等面燃燒 3.增面燃燒"}, {"id": 9, "cat": "易", "num": 9, "q": "依危害類別及混儲分組表中，按混儲規定需採用何種作業方式達成混儲標準", "a": "以砂包構築寬一公尺、高二公尺之擋牆做為間隔"}, {"id": 10, "cat": "易", "num": 10, "q": "火警標誌區分為哪兩種", "a": "1.傳統性彈藥火警標誌 2.化學彈藥火警標誌"}, {"id": 11, "cat": "易", "num": 11, "q": "請寫出爆炸藥鏈中基本作用藥鏈如何排列", "a": "火帽→雷管→傳爆管→炸裂藥"}, {"id": 12, "cat": "易", "num": 12, "q": "彈藥產生漏流之結晶物，應如何處理", "a": "應用布沾丙酮溶劑拭淨"}, {"id": 13, "cat": "易", "num": 13, "q": "現行國軍彈藥及另件籌補獲得方式有哪些", "a": "1.軍備局生產廠 2.中科院委製 3.國外採購"}, {"id": 14, "cat": "易", "num": 14, "q": "擋牆之目的", "a": "使兩炸藥集團分離、防止殉爆"}, {"id": 15, "cat": "易", "num": 15, "q": "雷管在混儲分類中，屬於哪一組？應如何儲存", "a": "1.屬B組 2.雷管及藥包應分開儲存"}, {"id": 16, "cat": "易", "num": 16, "q": "空殼繳回，使用單位需使用之單證識別碼為何", "a": "C9T、C8W"}, {"id": 17, "cat": "易", "num": 17, "q": "迫擊砲彈是由哪些部分所組成", "a": "1.引信 2.彈頭 3.發射藥 4.底火和穩定裝置"}, {"id": 18, "cat": "易", "num": 18, "q": "發射藥藥安定劑0.2%-0.29%之樣品數，已超過試驗總樣品數二分之一者（包含）以上做何處置", "a": "管制於1年內轉作教育訓練推耗，並於半年內實施複驗"}, {"id": 19, "cat": "易", "num": 19, "q": "整修所及彈藥連多久彙整廢彈銷燬除帳資料，呈地支部彈藥庫（支援營）辦理審、轉作業", "a": "每半個月（區分上、下半月）彙整"}, {"id": 20, "cat": "易", "num": 20, "q": "彈藥基本攜行量計算要求為何", "a": "部隊編制武器×攜行基準×彈種配賦百分比"}, {"id": 21, "cat": "易", "num": 21, "q": "國防部訂定彈藥籌補目標為何", "a": "1.精準（序號）彈藥低於80% 2.一般（批號）彈藥低於50%"}, {"id": 22, "cat": "易", "num": 22, "q": "未爆彈安全考量項目為何", "a": "1.作業風向與風速 2.時間與溫度 3.銷燬限量與作業量"}, {"id": 23, "cat": "易", "num": 23, "q": "八級品彈藥檢查週期為何", "a": "1.化學彈／每月 2.迫砲彈、引信／每半年 3.輕兵器彈藥／每年"}, {"id": 24, "cat": "易", "num": 24, "q": "彈藥憑單單證識別C3A使用意義", "a": "1.超量彈藥 2.不適用彈藥 3.跨年度領用教彈繳回"}, {"id": 25, "cat": "易", "num": 25, "q": "起爆器不良有哪三種可能", "a": "1.機件老舊 2.操作錯誤 3.電池電流不足"}, {"id": 26, "cat": "易", "num": 26, "q": "黃磷彈儲存方式為何", "a": "應置於通風、陰涼庫房，且直立儲存，彈頭朝上為佳"}, {"id": 27, "cat": "易", "num": 27, "q": "半地下化庫房為何種型式庫房？具有哪些功效", "a": "1.鋼筋水泥式覆土拱型彈庫 2.具抗炸、防火、防潮等功效"}, {"id": 28, "cat": "易", "num": 28, "q": "彈藥週期檢查其檢查週期區為哪四種", "a": "1.W類4年 2.X類3年 3.Y類2年 4.Z類1年"}, {"id": 29, "cat": "易", "num": 29, "q": "迫擊砲彈其穩定裝置區分為哪些", "a": "1.尾翼組 2.旋轉碟組"}, {"id": 30, "cat": "易", "num": 30, "q": "需要補給率之申請程序為何", "a": "係由下而上，逐級循指揮系統提出"}, {"id": 31, "cat": "易", "num": 31, "q": "庫區內應設置哪些警報系統，使作業區人員均能迅速採取行動", "a": "1.音響、燈光 2.或兩者併用之"}, {"id": 32, "cat": "易", "num": 32, "q": "彈藥技術檢查中有關火工件物（化）性檢測區分為何", "a": "1.底火落錘試驗 2.發射藥安定劑含量檢測 3.效能試射"}, {"id": 33, "cat": "易", "num": 33, "q": "彈藥儲存原則為何", "a": "1.遮蔽 2.枕木 3.通風"}, {"id": 34, "cat": "易", "num": 34, "q": "未爆彈爆燬遇不發火情況，應如何處理", "a": "等待30分鐘後再前往勘查原因，並重新裝置引爆"}, {"id": 35, "cat": "易", "num": 35, "q": "在抽樣計畫中以A.Q.L值及樣品之大小決定缺點之允收剔退數稱為", "a": "允許品質水準"}, {"id": 36, "cat": "易", "num": 36, "q": "固定式、半固定式及分離式彈藥量計算法為何", "a": "採彈頭內炸藥之淨重，不包括發射藥量"}, {"id": 37, "cat": "中", "num": 1, "q": "彈藥批號與標誌要求規定為何", "a": "彈藥保修應力求作業品質，標誌識別更須清晰正確，避免識別錯誤而導致誤撥或誤用，進而造成人員或裝備損傷"}, {"id": 38, "cat": "中", "num": 2, "q": "彈藥前推、預置分屯數量基準為何", "a": "3分之5戰備存量前推預置於部隊後方，2分之5戰備存量保留至彈補點（前支點）"}, {"id": 39, "cat": "中", "num": 3, "q": "空殼遺失調查應準備哪些文件", "a": "1.彈藥射擊紀錄報告表暨無空殼消耗證明書 2.旅級（含比照）主官保證書 3.相關佐證資料（例如：課表、射擊公告等）"}, {"id": 40, "cat": "中", "num": 4, "q": "彈藥變質的原因為何", "a": "1.氣候：過高氣溫或濕度 2.搬運：因摔、碰及掉落造成損耗 3.包裝：不良包裝導致損耗 4.儲存環境：不良遮蔽或不適切保管方式"}, {"id": 41, "cat": "中", "num": 5, "q": "彈藥需要補給率意義", "a": "為每種武器維持一特定時間之作戰，所需彈藥之估計數；此項需要補給率以每種武器每日所需射擊發數或其他適當單位表示之"}, {"id": 42, "cat": "中", "num": 6, "q": "庫房空間容量設計計算考慮因素有哪些", "a": "1.安全和彈藥之特性 2.建築物構造之特性 3.地面承受力之限制 4.工作便利之考慮"}, {"id": 43, "cat": "中", "num": 7, "q": "彈藥帳籍管理之原則有哪些", "a": "1.落實彈藥清點 2.嚴密爆材暨爆破器材相關管制規定 3.落實彈藥交接清點"}, {"id": 44, "cat": "中", "num": 8, "q": "現有補給率分配程序，其發布方式有哪些", "a": "1.勤務支援命令 2.作戰命令第四段 3.個別命令 4.火力支援計畫附件"}, {"id": 45, "cat": "中", "num": 9, "q": "輕兵器彈藥之檢查方法為何", "a": "1.有無鏽蝕、髒污及油漬 2.藥筒有無裂口及凹痕、凸瘤 3.彈頭有無鬆動或短彈 4.曳光彈彈頭有無裂痕"}, {"id": 46, "cat": "中", "num": 10, "q": "彈藥抽樣計畫適用範圍為何", "a": "1.庫儲彈實施技術檢查 2.彈藥管理單位接收新品或另件之使用前檢查 3.整修過程與修成品檢驗"}, {"id": 47, "cat": "中", "num": 11, "q": "何謂特別檢查", "a": "係奉上級命令、外島專案或應地區受支援單位申請所實施檢查，如輔導訪問檢查、艦艇彈藥鑑整及危安事件調查等"}, {"id": 48, "cat": "中", "num": 12, "q": "彈藥修製作業中，請問SOP作用為何", "a": "1.SOP為標準作業程序之簡稱 2.作用為彈藥保修作業之標準操作步驟、品質管制及安全規定，含工具裝備需求"}, {"id": 49, "cat": "中", "num": 13, "q": "發射藥銷燬處理作業時人員撤離距離規定", "a": "1.點火人員不得少於90公尺，且要有正面防護之掩體（高度約2公尺） 2.一般作業人員距離不得少於300公尺"}, {"id": 50, "cat": "中", "num": 14, "q": "基於勘察與處理之要求，未爆彈依其危險程度分類有幾項", "a": "1.高爆炸彈與大型爆炸物 2.殺傷炸彈 3.縱火炸彈 4.小型彈頭"}, {"id": 51, "cat": "中", "num": 15, "q": "八級品輕兵器彈藥儲存要領", "a": "1.可以和任何八級品彈藥儲存，不可與其他素質彈藥混儲 2.零星彈藥應裝箱釘牢"}, {"id": 52, "cat": "中", "num": 16, "q": "彈藥鉛封適用範圍為何", "a": "各式輕兵器彈藥「內裝鐵罐（塑膠盒）未開啟」、殺傷手榴彈、爆材及火箭彈等中、小口徑彈藥屬重鉛封範疇"}, {"id": 53, "cat": "中", "num": 17, "q": "無空殼彈種核銷有哪些品項？需準備哪些資料辦理核銷作業", "a": "1.各式爆材、CS膠囊、海用干擾彈、空用炸彈等 2.檢附課表、射擊記錄報告表暨無空殼消耗證明書"}, {"id": 54, "cat": "中", "num": 18, "q": "彈藥檢查的範圍為何", "a": "1.彈藥及其零件、包裝器材 2.儲存彈藥之建築物及露儲場地 3.儲存彈藥場所周圍環境及防護設施"}, {"id": 55, "cat": "中", "num": 19, "q": "彈藥籌補原則有哪些", "a": "1.統一構型 2.分年獲得 3.確保商源 4.籌補指標 5.裝備壽限"}, {"id": 56, "cat": "中", "num": 20, "q": "C49引信主要結構組成為何", "a": "1.調時環模組 2.計時電路模組 3.風力發電機 4.安全備炸組 5.下引信體組"}, {"id": 57, "cat": "中", "num": 21, "q": "火箭彈是由哪四大部分所組成", "a": "1.彈頭 2.引信 3.推進機總成 4.穩定裝置"}, {"id": 58, "cat": "中", "num": 22, "q": "避雷針及靜電棒之檢查時機為何", "a": "1.每月外觀檢查，每季使用電錶量測電阻值 2.如遇雷雨、颱風或地震後，亦需使用電錶量測電阻值"}, {"id": 59, "cat": "中", "num": 23, "q": "請簡述彈藥特性", "a": "1.消耗大量性 2.需求連續性 3.儲運危險 4.補給跟進性 5.彈種複雜性"}, {"id": 60, "cat": "中", "num": 24, "q": "彈藥修製計畫之擬訂及修訂時限為何", "a": "1.年度前18個月擬訂修製計畫 2.年度前12個月第一次修訂 3.年度前3個月第二次修訂並完成送審 4.年度開始後僅能於每季實施月進度調整"}, {"id": 61, "cat": "中", "num": 25, "q": "隔火牆目的與要求標準為何", "a": "1.隔火牆的目的是防止火焰的傳播及擴大火災的範圍 2.隔火牆一般的高度，要達到屋頂及兩側"}, {"id": 62, "cat": "中", "num": 26, "q": "何謂彈藥技術外觀檢查？要項重點為何", "a": "1.以視覺、觸覺、嗅覺及儀器、量具實施檢驗，判定彈藥堪用性 2.物理性質檢驗，如合膛、引信深孔量度、秤重、氣密試驗、X光透視檢查、超音波金屬檢驗等"}, {"id": 63, "cat": "中", "num": 27, "q": "效能試射所包含之範圍為何", "a": "針對外觀檢查及火工另件檢測，仍無法判定其妥善性與效能（發射藥化學性檢驗不合格）之彈藥"}, {"id": 64, "cat": "中", "num": 28, "q": "依支援協派遣未爆組支援民間未爆彈處理，須完成哪些評估與規劃", "a": "1.場地幅員、大小 2.火炸藥限量 3.安全防護整備 4.完成銷燬場地緊急救災應變規劃"}, {"id": 65, "cat": "中", "num": 29, "q": "主官交接時，彈藥應由哪些人員參與監交", "a": "1.彈藥保管員 2.新、舊任主官 3.單位監察人員 4.上一級主官及帳管人員"}, {"id": 66, "cat": "中", "num": 30, "q": "彈藥庫房哪些彈藥種類，符合大打包作業規定", "a": "1.手槍彈 2.殺傷手榴彈 3.肩射式火箭彈 4.爆材 5.輕兵器彈藥"}, {"id": 67, "cat": "中", "num": 31, "q": "包裝器材遇哪些缺點須立即改進", "a": "1.鉛封脫落或損壞 2.螺釘或鐵釘所釘位置不對 3.可用瓦楞釘修理之木板裂縫 4.油漆塗刷不整潔"}, {"id": 68, "cat": "中", "num": 32, "q": "剔退作業應備器具為何", "a": "1.紅色噴漆 2.紅色警示旗 3.剔退彈專用箱 4.剔退彈存放區"}, {"id": 69, "cat": "中", "num": 33, "q": "何謂作戰彈藥需要量", "a": "武器數×〔第一日武器彈藥消耗發數＋（作戰天數－1）×後續各日平均消耗量〕×彈種配賦百分比"}, {"id": 70, "cat": "中", "num": 34, "q": "起爆劑堆積要領為何", "a": "1.單獨儲存 2.應放在水中，不可使其乾燥和凍結 3.不可遭到陽光直射"}, {"id": 71, "cat": "中", "num": 35, "q": "危害類別及混儲分組規定表中交叉點有「Z」符號者表示為何", "a": "1.作業上之考量或庫房不敷使用時 2.在不違背安全規定的原則下，不同組別品項之有限量，可經司令部核准後實施混儲"}, {"id": 72, "cat": "中", "num": 36, "q": "剔退程序的目的為何", "a": "藉管制作為，將各作業站無法折卸品，予以規範剔退作業流程，以維護作業安全"}, {"id": 73, "cat": "難", "num": 1, "q": "待修彈藥修製另件需求檢討作業程序為何", "a": "1.依年度工作計畫及整修材料消耗表檢討 2.臨時接收單位後送堪修品，依彈藥損壞及實際狀況呈報 3.陸勤部依彈藥存量狀況及損耗率，預定未來5年全軍彈藥保養整修計畫，籌劃所需材料"}, {"id": 74, "cat": "難", "num": 2, "q": "發射藥質變率數據資料收集方法為何", "a": "1.調查法 2.登記法 3.實驗法 4.次級資料法 5.觀察法 6.模擬法 7.測驗法"}, {"id": 75, "cat": "難", "num": 3, "q": "未爆彈處理作業安管計畫內容包含哪些", "a": "1.作業規劃 2.督管及任編組 3.安全講習 4.勤前教育 5.場地整備 6.安全管制措施（警戒、消防） 7.裝備檢查 8.通信整備 9.風險圖像分析及管控對策及全程完成紀實資料（含照片及圖說）"}, {"id": 76, "cat": "難", "num": 4, "q": "彈藥庫對現有未爆彈暫存庫房巡查狀況為何", "a": "1.庫區內未爆彈暫存庫房每日1100、1500時各巡查乙次 2.鄰近靶場之暫存庫房每日下午1400-1700時巡查乙次；暫存庫房無未爆彈時，則每週巡查乙次"}, {"id": 77, "cat": "難", "num": 5, "q": "照明彈庫房囤儲要求標準為何", "a": "1.需要防潮濕、防水氣及防高溫庫房 2.儲放照明彈庫房，不得使用消防水、泡沫及CO2滅火器 3.已受潮之照明彈為危險品，應即報請銷燬處理"}, {"id": 78, "cat": "難", "num": 6, "q": "廢彈處理作業節點要求有哪些", "a": "1.教育訓練 2.廠線設施整備 3.課前準備會議 4.廢彈處理作業 5.廠線清理作業 6.作業檢討會"}, {"id": 79, "cat": "難", "num": 7, "q": "從事哪些有關工作之場所，應設置導電地板", "a": "1.裝有電雷管尚未裝箱之散裝彈藥 2.暴露之電器爆炸裝置如爆管雷管等 3.電線外露之電器起爆彈藥，如火箭彈 4.人體靜電放電可以引燃之危險物質"}, {"id": 80, "cat": "難", "num": 8, "q": "彈藥庫火警標誌表示內容與圖形為何", "a": "1.第1類火警標誌：集體爆炸，八角形 2.第2類火警標誌：非集體爆炸、有破片災害之危險，交叉十字形 3.第3類火警標誌：集體燃燒，倒三角形 4.第4類火警標誌：非集體燃燒、屬緩燃性物料無爆炸，菱形"}, {"id": 81, "cat": "難", "num": 9, "q": "彈藥等級區分10級，其中第4級代表意義及適用情況為何", "a": "第4級代表：待測試（含彈藥包裝器材及測試試彈藥）。適用情況：1.彈藥包裝器材 2.試驗新出廠武器之專用彈藥 3.庫儲彈藥專案委託生產鑑測單位功能測試和進行技術評估（效能試射），以作為判定其可靠性及堪用性"}, {"id": 82, "cat": "難", "num": 10, "q": "彈藥檢查標準作業程序應包括有哪些", "a": "1.週期檢查頻率 2.抽樣數量 3.參考資料 4.作業程序（按分項步驟分別詳列缺點區分） 5.缺點判斷（合格標準） 6.等級判定 7.表報作業 8.安全手則"}, {"id": 83, "cat": "難", "num": 11, "q": "重大演訓用彈其彈藥分庫（連），實施彈藥檢查管制作為為何", "a": "撥發時由撥發彈藥分庫（連）主官及彈檢人員實施檢整後，會同受支援單位業管軍官實施「素質鑑定」確認，於彈藥檢查報告表中「建議處理辦法」欄位簽名"}, {"id": 84, "cat": "難", "num": 12, "q": "部隊在分裝式彈頭保養中，可執行作業有哪些", "a": "1.清理擦拭與彈體防護（如：換裝彈帶護圈） 2.彈體外觀輕鏽清除 3.內、外包裝檢整更換 4.小面積噴漆與部分重標誌"}, {"id": 85, "cat": "難", "num": 13, "q": "彈藥六級保養作業有哪些", "a": "1.施以除鏽、重噴漆、塗矽化黃油、更換彈帶護圈、引信塞、擦洗滲漏 2.木箱、紙筒、塑膠筒等內外包裝之修理更換 3.實施彈體、包裝重噴漆、標誌等，並變更料（批）號、年份者"}, {"id": 86, "cat": "難", "num": 14, "q": "彈藥混儲分類之考慮條件包括以下幾點", "a": "1.化學及物質性質 2.設計特性 3.內部及外部包裝方式 4.量距分類 5.火炸藥淨重 6.衰變率 7.起爆敏感度 8.受爆燃、爆轟、爆炸之影響"}, {"id": 87, "cat": "難", "num": 15, "q": "彈藥前支點部署原則為何", "a": "1.運用堅固地下化建築、涵洞、隧道或現有具隱（掩）蔽設施 2.針對遠離地區支援後勤限範圍，經作戰區核定，由地支部後專業部隊前推開設前支點，於第一線部隊後方10-15公里地區適合位置開設「彈藥前支點」以利就近支援"}, {"id": 88, "cat": "難", "num": 16, "q": "黃磷彈庫房巡查方式及頻率為何", "a": "1.不具環控系統每日上或下午巡檢乙次 2.具環控系統，可將巡檢週期修正為每週二、五上或下午巡檢乙次實施"}, {"id": 89, "cat": "難", "num": 17, "q": "彈藥庫房型式分為哪六大類型", "a": "1.制式庫房 2.半地下化庫房 3.代用庫房 4.臨時儲存所 5.防潮塑膠庫房 6.坑道鋁鋅鋼棚"}, {"id": 90, "cat": "難", "num": 18, "q": "寄屯彈藥清點作業為何", "a": "1.每月由庫儲管理單位排定日期後，主動發函（電話）通知寄存單位 2.每月實施乙次清點 3.寄存單位需主動提供安全查核名冊，俾利庫儲管理單位查驗身分"}];let S=[],i=0,O=0,N=0,M='';const L={'易':15,'中':10,'難':5};function sh(a){a=[...a];for(let x=a.length-1;x>0;x--){let y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]]}return a}function by(c,a,b){return QUESTIONS.filter(x=>x.cat===c&&x.num>=a&&x.num<=b)}function pk(a,n){return sh(a).slice(0,n)}function hide(){['home','custom','quiz','result'].forEach(x=>document.getElementById(x).classList.add('hidden'))}function home(){hide();document.getElementById('home').classList.remove('hidden')}function range(c,a,b,r){start(by(c,a,b),c+' '+a+'–'+b+(r?' 隨機':' 依序'),r)}function random30(){start([...pk(by('易',1,36),15),...pk(by('中',1,36),10),...pk(by('難',1,18),5)],'全部隨機30題｜易15＋中10＋難5',1)}function start(p,m,r){S=r?sh(p):[...p];i=O=N=0;M=m;hide();document.getElementById('quiz').classList.remove('hidden');render()}function render(){if(i>=S.length)return finish();let x=S[i];mode.textContent=M;counter.textContent=(i+1)+' / '+S.length;qid.textContent=x.cat+x.num;question.textContent=x.q;input.value='';input.disabled=false;answer.textContent=x.a;answer.style.display='none';judge.classList.add('hidden');show.classList.remove('hidden');stat()}function showAns(){if(!input.value.trim()){alert('請先輸入答案');input.focus();return}input.disabled=true;answer.style.display='block';judge.classList.remove('hidden');show.classList.add('hidden')}function mark(v){v?O++:N++;i++;render()}function stat(){let d=O+N;ok.textContent=O;ng.textContent=N;rate.textContent=(d?Math.round(O/d*100):0)+'%';bar.style.width=(S.length?i/S.length*100:0)+'%'}function finish(){hide();result.classList.remove('hidden');let d=O+N;summary.innerHTML='共 <b>'+d+'</b> 題｜答對 <b>'+O+'</b>｜答錯 <b>'+N+'</b>｜正確率 <b>'+(d?Math.round(O/d*100):0)+'%</b>'}function custom(){hide();document.getElementById('custom').classList.remove('hidden');picklist.innerHTML=QUESTIONS.map(x=>'<label class="pick"><input type="checkbox" class="cb" data-c="'+x.cat+'" value="'+x.id+'" onchange="lim(this)"><span><b>'+x.cat+x.num+'</b>｜'+x.q+'</span></label>').join('');countsUp()}function sel(c){return [...document.querySelectorAll('.cb[data-c="'+c+'"]:checked')]}function lim(e){let c=e.dataset.c;if(sel(c).length>L[c]){e.checked=false;alert(c+'最多選'+L[c]+'題')}countsUp()}function countsUp(){counts.innerHTML=['易','中','難'].map(c=>'<span class="pill">'+c+'：'+sel(c).length+' / '+L[c]+'</span>').join('')}function clearPick(){document.querySelectorAll('.cb').forEach(x=>x.checked=false);countsUp()}function autoPick(){clearPick();['易','中','難'].forEach(c=>sh([...document.querySelectorAll('.cb[data-c="'+c+'"]')]).slice(0,L[c]).forEach(x=>x.checked=true));countsUp()}function startCustom(){for(let c of ['易','中','難'])if(sel(c).length!==L[c]){alert('請選滿：易15、中10、難5');return}let ids=new Set([...document.querySelectorAll('.cb:checked')].map(x=>+x.value));start(QUESTIONS.filter(x=>ids.has(x.id)),'自行選題30題',1)}if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
